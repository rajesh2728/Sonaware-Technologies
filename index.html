<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Maintenance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #333;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }
        .timestamp {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>We're Currently Under Maintenance</h1>
        <p>Thank you for your patience while we work to improve our site.</p>
        <p>We'll be back shortly.</p>
        <p class="timestamp">Current Date and Time (UTC): 2026-04-30 12:33:30</p>
    </div>
</body>
</html>
